{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="content-narrow">
  <a class="back-link" href="{{ url_for('home') }}">← Back to Home</a>
  <div class="section-heading"><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Choose a strong password you don't use elsewhere.</p></div>
  <div class="panel form-panel">
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div><label class="form-label" for="current_password">Current password</label><input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
      <div><label class="form-label" for="new_password">New password</label><input class="form-control" id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required><div class="form-hint">At least 8 characters.</div></div>
      <div><label class="form-label" for="confirm_password">Confirm new password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
